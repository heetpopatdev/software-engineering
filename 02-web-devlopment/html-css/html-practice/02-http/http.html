    <title>What is HTTP?</title>
  </head>
  <body>
    <h1>What is HTTP?</h1>
    <p>
      HTTP stands for HyperText Transfer Protocol. It is a set of rulues used
      for communication between a browser and a server.
    </p>
    <h2>HTTP Request</h2>
    <p>
      The browser sends a request to the server asking for a webpage or other
      resource.
    </p>
    <p>HTTP REQEST</p>
    <p>↓</p>
    <p>SERVER</p>
    <p>↓</p>
    <p>HTTP RESPONSE</p>
    <p>↓</p>
    <p>BROWSER</p>
    <p>↓</p>
    <p>WEBPAGE</p>
  </body>
</html>
