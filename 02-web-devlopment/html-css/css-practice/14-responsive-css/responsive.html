<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive CSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>My Products</h1>
      <p>Responsive CSS Practice</p>
    </header>
    <main>
      <section class="products">
        <article class="card">
          <img
            src="https://media.istockphoto.com/id/1389603578/photo/laptop-blank-screen-on-wood-table-with-blurred-coffee-shop-cafe-interior-background-and.jpg?s=612x612&w=0&k=20&c=bPf3XxUZJZ6HRw7BE75ur1wBMCm_r4QAr-_lajERIyU="
            alt="Product"
          />
          <h2>Laptop</h2>
          <p>Powerful laptop for developers.</p>
          <button>Buy Now</button>
        </article>

        <article class="card">
          <img
            src="https://hhkeyboard.us/-/media/project/hhkeyboard/features/producthybridwhitetopnobg.png?h=850&iar=0&mw=1200&w=1112"
            alt="Product"
          />
          <h2>Keyboard</h2>
          <p>Mechanical Keyboard for coding.</p>
          <button>Buy Now</button>
        </article>

        <article class="card">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6VjaJR52f0LmspCttIIMVKoNG1IzbwVFBFUM0zwOzVuTFKZ-0bru_U2B5&s=10"
            alt="Product"
          />
          <h2>Mouse</h2>
          <p>Comfortable mouse for everday use.</p>
          <button>Buy Now</button>
        </article>
      </section>
    </main>
  </body>
</html>
