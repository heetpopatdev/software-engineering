<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animations Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>CSS Animations</h1>
    <section>
      <h2>Transition</h2>
      <button class="transition-button">Hover Me</button>
    </section>
    <section>
      <h2>Tranform- Scale</h2>
      <div class="scale-box">Hover Me</div>
    </section>
    <section>
      <h2>Tranform - Rotate</h2>
      <div class="rotate-box">Rotate</div>
    </section>
    <section>
      <h2>Tranform - Translate</h2>
      <div class="translate-box">Hover Me</div>
    </section>
    <section>
      <h2>Keyframe Animation</h2>
      <div class="animated-box">Moving</div>
    </section>
  </body>
</html>
