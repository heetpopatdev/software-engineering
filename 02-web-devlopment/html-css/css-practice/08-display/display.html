<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Display Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>CSS Display</h1>
    <section>
      <h2>Block</h2>
      <div class="block-box">Block 1</div>
      <div class="block-box">Block 2</div>
    </section>
    <section>
      <h2>Inline</h2>
      <span class="inline-box"> Inline 1 </span>
      <span class="inline-box"> Inline 2 </span>
      <span class="inline-box"> Inline 3 </span>
    </section>
    <section>
      <h2>Inline-Block</h2>
      <div class="inline-block-box">Box 1</div>
      <div class="inline-block-box">Box 2</div>
      <div class="inline-block-box">Box 3</div>
    </section>
    <section>
      <h2>Display None</h2>
      <div>Visible Box</div>
      <div class="none-box">You cannot see me.</div>
      <div>Another Visible Box</div>
    </section>
    <section>
      <h2>Visibility Hidden</h2>
      <div>Box 1</div>
      <div class="hidden-box">Hidden Box</div>
      <div>Box 3</div>
    </section>
    <section>
      <h2>Flex</h2>
      <div class="flex-container">
        <div>Card 1</div>
        <div>Card 2</div>
        <div>Card 3</div>
      </div>
    </section>
    <section>
      <h2>Grid</h2>

      <div class="grid-container">
        <div>Card 1</div>
        <div>Card 2</div>
        <div>Card 3</div>
        <div>Card 4</div>
        <div>Card 5</div>
        <div>Card 6</div>
      </div>
    </section>
  </body>
</html>
