<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Syntax Basics</title>
    <style>
      /*

            CSS RULE

            selector {
            property:value;
            }

        */

      /* Style the main heading */
      h1 {
        color: blue;
        font-size: 40px;
      }

      /*Style the paragraph*/
      p {
        color: gray;
        font-size: 20px;
      }

      /*
        Multiple declarations can be written inside one CSS rule.
        */

      .highlight {
        color: red;
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>CSS Syntax Basics</h1>

    <p>CSS uses selectors, properties, and values to style HTML elements.</p>

    <p class="highlight">
      This paragraph demonstrates multiple CSS declarations.
    </p>
  </body>
</html>
